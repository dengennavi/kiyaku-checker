name: 規約まとめページのチェック結果

# チェック自体はこのPC（日本）で毎日動かす（tools/run_daily_check.sh）。
# 結果の check/status.json が送られてきたら中身を見て、
# 「変更あり」が1件でもあれば失敗にする → GitHub からメールで知らせが届く。
on:
  push:
    paths:
      - check/status.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 結果を確認
        run: |
          cat check/report.md >> "$GITHUB_STEP_SUMMARY"
          cat check/report.md
          python3 -c "import json,sys; c=json.load(open('check/status.json'))['changed']; sys.exit(1 if c else 0)"
