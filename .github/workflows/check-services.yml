name: 規約まとめページの毎日チェック

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 朝6時（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 公式の規約と引用を照らし合わせる
        env:
          CHROME: google-chrome
        run: python3 tools/check_services.py
